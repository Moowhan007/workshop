<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Dashboard ของคุณบน EduFlow AI — ระบบจัดการรายวิชา งานมอบหมาย การส่งงาน การตรวจงาน และการวิเคราะห์ความเสี่ยง"
  />
  <title>Dashboard — EduFlow AI</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23005bab'/%3E%3Cpath d='M8 10h16v3H8zM8 15h16v3H8zM8 20h10v3H8z' fill='white'/%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-auth="protected" class="dashboard-page">
  <header class="site-header">
    <div class="container header-inner">
      <a href="#main" class="brand">EduFlow AI</a>
      <nav aria-label="เมนู">
        <ul class="nav-links">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="role.html">เปลี่ยนบทบาท</a></li>
          <li><a href="#" onclick="logout()">ออกจากระบบ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container dash-main">
    <section class="dash-hero">
      <span class="eyebrow" id="dash-role"></span>
      <h1 id="dash-greeting">ยินดีต้อนรับ</h1>
      <p class="dash-email" id="dash-email"></p>
    </section>

    <nav class="dash-tabs" id="dash-tabs" aria-label="เมนูภายใน"></nav>
    <div id="dash-content"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <div class="container">
        <p>© 2026 EduFlow AI สงวนลิขสิทธิ์</p>
      </div>
    </div>
  </footer>

  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script>
    /* ---------- utilities (เดิม) ---------- */
    function esc(value) {
      return String(value).replace(/[&<>"']/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      });
    }

    function statCard(value, label) {
      return '<div class="stat-card"><div class="stat-value">' + value + '</div><div class="stat-label">' + label + "</div></div>";
    }

    function barRow(label, value, percent) {
      return '<div class="bar-row"><div class="bar-label">' + esc(label) + '</div><div class="bar-track"><div class="bar-fill" style="width:' + percent + '%"></div></div><div class="bar-val">' + value + "</div></div>";
    }

    function riskBadge(risk) {
      return '<span class="risk-badge ' + risk.levelCls + '">' + risk.levelLabel + "</span>";
    }

    function emptyNote(text) {
      return '<p class="empty-note">' + esc(text) + "</p>";
    }

    /* ---------- render ภาพรวม (เดิม เก็บไว้ใช้เป็น Tab ภาพรวม) ---------- */
    function renderTeacherDashboard(db, teacher) {
      const analytics = teacherAnalytics(db, teacher.id);
      let html = '';

      html += '<div class="dash-stats">';
      html += statCard(analytics.courses.length, "จำนวนรายวิชา");
      html += statCard(analytics.studentCount, "จำนวนนักเรียน");
      html += statCard(analytics.assignmentCount, "จำนวนงาน");
      html += statCard(analytics.pendingCount, "งานค้างตรวจ");
      html += statCard(analytics.avgScore, "คะแนนเฉลี่ย");
      html += "</div>";

      html += '<div class="dash-cols">';
      html += '<div class="dash-panel"><h2>อัตราการส่งงานแยกวิชา</h2>';
      if (analytics.perCourse.length) {
        analytics.perCourse.forEach(function (item) {
          html += barRow(item.course.code + " " + item.course.title, item.submissionRate + "%", item.submissionRate);
        });
      } else {
        html += emptyNote("ยังไม่มีรายวิชา");
      }
      html += "</div>";

      html += '<div class="dash-panel"><h2>ประสิทธิภาพรายวิชา (คะแนนเฉลี่ย)</h2>';
      if (analytics.perCourse.length) {
        analytics.perCourse.forEach(function (item) {
          html += barRow(item.course.code + " " + item.course.title, item.avgScore + " / 100", item.avgScore);
        });
      } else {
        html += emptyNote("ยังไม่มีรายวิชา");
      }
      html += "</div>";
      html += "</div>";

      const pendingRows = analytics.submissions.filter(function (submission) {
        return submission.score === null || submission.score === undefined;
      });
      html += '<div class="dash-panel"><h2>งานที่รอตรวจ</h2>';
      if (pendingRows.length) {
        html += '<div class="list-group">';
        pendingRows.forEach(function (row) {
          const assignment = findByAssignment(db, row.assignmentId);
          const course = courseById(db, assignment.courseId);
          const student = findUserById(db, row.studentId);
          html += '<div class="list-row"><div><strong>' + esc(assignment.title) + "</strong><br><small>" +
            esc(student.name) + " · " + esc(course.code) + "</small></div><span class='status-badge badge-late'>รอตรวจ</span></div>";
        });
        html += "</div>";
      } else {
        html += emptyNote("ไม่มีงานค้างตรวจ ขอชื่นชม!");
      }
      html += "</div>";

      html += '<div class="dash-panel"><h2>นักเรียนกลุ่มเสี่ยง</h2>';
      if (analytics.atRiskStudents.length) {
        html += '<div class="list-group">';
        analytics.atRiskStudents.forEach(function (item) {
          html += '<div class="list-row"><div><strong>' + esc(item.student.name) + "</strong><br><small>เข้าเรียน " +
            item.risk.attendancePct + "% · ค้าง " + item.risk.overdueCount + " งาน</small></div>" +
            riskBadge(item.risk) + "</div>";
        });
        html += "</div>";
      } else {
        html += emptyNote("ยังไม่มีข้อมูลนักเรียน");
      }
      html += "</div>";

      return html;
    }

    function renderStudentDashboard(db, student) {
      const rows = assignmentsWithStatusFor(db, student.id);
      const attendance = attendanceRate(db, student.id);
      const latest = latestScoredSubmission(db, student.id);
      const upcoming = upcomingAssignments(db, student.id, 7);
      const scored = scoredSubmissionsForStudent(db, student.id);
      const submittedCount = rows.filter(function (row) {
        return row.status === "submitted";
      }).length;
      const missingCount = rows.filter(function (row) {
        return row.status === "missing";
      }).length;

      let html = "";
      html += '<div class="dash-stats">';
      html += statCard(rows.length, "งานที่ได้รับ");
      html += statCard(submittedCount, "ส่งแล้ว");
      html += statCard(missingCount, "ยังไม่ส่ง");
      html += statCard(latest ? latest.score : "-", "คะแนนล่าสุด");
      html += statCard(attendance.pct + "%", "อัตราการเข้าเรียน");
      html += "</div>";

      html += '<div class="dash-cols">';
      html += '<div class="dash-panel"><h2>งานใกล้ครบกำหนด (7 วัน)</h2>';
      if (upcoming.length) {
        html += '<div class="list-group">';
        upcoming.forEach(function (row) {
          html += '<div class="list-row"><div><strong>' + esc(row.assignment.title) + "</strong><br><small>" +
            esc(row.course.code) + " · ครบกำหนด " + fmtDate(row.assignment.dueDate) + "</small></div>" +
            '<span class="status-badge badge-missing">ยังไม่ส่ง</span></div>';
        });
        html += "</div>";
      } else {
        html += emptyNote("ไม่มีงานใกล้ครบกำหนดในเร็ว ๆ นี้");
      }
      html += "</div>";

      html += '<div class="dash-panel"><h2>Feedback จาก AI</h2>';
      if (latest && latest.feedback) {
        html += '<div class="ai-box"><p>' + esc(latest.feedback) + "</p><small>จากงาน " + esc(findByAssignment(db, latest.assignmentId).title) + "</small></div>";
      } else {
        html += emptyNote("ยังไม่มี feedback ล่าสุดจาก AI");
      }
      html += "</div>";
      html += "</div>";

      html += '<div class="dash-panel"><h2>งานทั้งหมด</h2>';
      if (rows.length) {
        html += '<table class="dash-table"><thead><tr><th>รายวิชา</th><th>งาน</th><th>ครบกำหนด</th><th>คะแนน</th><th>สถานะ</th></tr></thead><tbody>';
        rows.forEach(function (row) {
          html += "<tr><td>" + esc(row.course.code) + "</td><td>" + esc(row.assignment.title) +
            "</td><td>" + fmtDate(row.assignment.dueDate) + "</td><td>" +
            (row.submission && row.submission.score !== null ? row.submission.score : "-") +
            '</td><td><span class="status-badge ' + row.statusCls + '">' + row.statusLabel + "</span></td></tr>";
        });
        html += "</tbody></table>";
      } else {
        html += emptyNote("ยังไม่มีงาน");
      }
      html += "</div>";

      html += '<div class="dash-panel"><h2>ระดับความเสี่ยง</h2>' + riskBadge(computeRisk(db, student.id)) + "</div>";

      return html;
    }

    function renderParentDashboard(db, parent) {
      const linkedEmail = parent.linkedStudentEmail;
      let child = null;
      if (linkedEmail) {
        child = findByEmail(db, linkedEmail);
      }
      if (!child) {
        return '<div class="dash-panel"><h2>เชื่อมต่อบุตรหลาน</h2>' +
          emptyNote("ยังไม่มีการเชื่อมอีเมลบุตรหลาน ระบบจะช่วยให้คุณติดตามการส่งงานและการเรียนเมื่อเชื่อมต่อแล้ว") + "</div>";
      }

      const risk = computeRisk(db, child.id);
      const attendance = attendanceRate(db, child.id);
      const rows = assignmentsWithStatusFor(db, child.id);
      const overdueRows = rows.filter(function (row) {
        return row.status === "missing" || row.status === "late";
      });
      const latest = latestScoredSubmission(db, child.id);
      const scored = scoredSubmissionsForStudent(db, child.id);
      const alerts = parentAlerts(db, child.id);

      let html = "";
      html += '<div class="dash-panel dash-child-head"><h2>บุตรหลานของคุณ</h2><p>' + esc(child.name) +
        " (" + esc(child.email) + ")</p>" + riskBadge(risk) + "</div>";

      html += '<div class="dash-stats">';
      html += statCard(risk.avgScore, "คะแนนเฉลี่ย");
      html += statCard(attendance.pct + "%", "การเข้าเรียน");
      html += statCard(overdueRows.length, "งานค้างส่ง");
      html += statCard(latest ? latest.score : "-", "คะแนนล่าสุด");
      html += statCard(RISK_META[risk.level].label, "ระดับความเสี่ยง");
      html += "</div>";

      html += '<div class="dash-cols">';
      html += '<div class="dash-panel"><h2>การแจ้งเตือน</h2>';
      if (alerts.length) {
        html += '<ul class="alert-list">';
        alerts.forEach(function (alertItem) {
          html += '<li class="alert-item">' + esc(alertItem.text) + "</li>";
        });
        html += "</ul>";
      } else {
        html += emptyNote("ไม่มีการแจ้งเตือนใหม่");
      }
      html += "</div>";

      html += '<div class="dash-panel"><h2>สถานะงานล่าสุด</h2>';
      if (rows.length) {
        html += '<div class="list-group">';
        rows.slice(0, 6).forEach(function (row) {
          html += '<div class="list-row"><div><strong>' + esc(row.assignment.title) + "</strong><br><small>" +
            esc(row.course.code) + " · " + fmtDate(row.assignment.dueDate) + "</small></div>" +
            '<span class="status-badge ' + row.statusCls + '">' + row.statusLabel + "</span></div>";
        });
        html += "</div>";
      } else {
        html += emptyNote("ยังไม่มีงาน");
      }
      html += "</div>";
      html += "</div>";

      if (scored.length) {
        html += '<div class="dash-panel"><h2>คะแนนย้อนหลัง</h2>';
        html += '<div class="list-group">';
        scored.slice(0, 5).forEach(function (submission) {
          const assignment = findByAssignment(db, submission.assignmentId);
          html += '<div class="list-row"><div><strong>' + esc(assignment.title) + "</strong><br><small>" +
            fmtDate(submission.submittedAt) + "</small></div><span class='score-badge'>" + submission.score + " / " + assignment.points + "</span></div>";
        });
        html += "</div></div>";
      }

      return html;
    }

    /* =========================================================
       ส่วนขยาย: ระบบจัดการรายวิชา / งานมอบหมาย / การส่ง / การตรวจ
       ========================================================= */

    const FILE_CAP = 1300000;
    let dashDB = null;
    let dashUser = null;
    let dashCourseFilter = "all";
    let dashGradeFilter = "";
    let activeModal = null;

    function toastMessage(message) {
      let toast = document.getElementById("app-toast");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "app-toast";
        toast.className = "toast";
        toast.setAttribute("role", "status");
        document.body.appendChild(toast);
      }
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(function () {
        toast.classList.remove("show");
      }, 2800);
    }

    function closeModal() {
      if (activeModal) {
        activeModal.remove();
        activeModal = null;
      }
    }

    function openModal(title, bodyHtml) {
      closeModal();
      const el = document.createElement("div");
      el.className = "modal-backdrop open";
      el.innerHTML =
        '<div class="modal"><button type="button" class="modal-close" aria-label="ปิด">&times;</button>' +
        "<h2>" + esc(title) + "</h2>" +
        '<div class="modal-body">' + bodyHtml + "</div></div>";
      el.querySelector(".modal-close").addEventListener("click", closeModal);
      el.addEventListener("click", function (event) {
        if (event.target === el) {
          closeModal();
        }
      });
      document.body.appendChild(el);
      activeModal = el;
      return el;
    }

    function readFileAsDataURL(file, callback) {
      if (file.size > FILE_CAP) {
        callback(null);
        return;
      }
      const reader = new FileReader();
      reader.onload = function () {
        callback(reader.result);
      };
      reader.onerror = function () {
        callback(null);
      };
      reader.readAsDataURL(file);
    }

    function fileChipHtml(fileName, fileType, fileSize, fileData) {
      let html = '<span class="file-chip"><strong>' + esc(fileName) + "</strong>";
      if (fileSize) {
        html += " · " + Math.round(fileSize / 1024) + " KB";
      }
      if (fileType) {
        html += " · " + esc(fileType.split("/").pop().toUpperCase());
      }
      html += "</span>";
      if (fileData) {
        html += ' <a class="link-btn" href="' + fileData + '" target="_blank" rel="noopener">เปิดดูไฟล์ ↗</a>';
      }
      return html;
    }

    function statusBadgeHtml(status) {
      const meta = STATUS_META[status] || STATUS_META.missing;
      return '<span class="status-badge ' + meta.cls + '">' + meta.label + "</span>";
    }

    const DASH_VIEWS = {
      teacher: [
        { key: "overview", label: "ภาพรวม", run: function () { return renderTeacherDashboard(dashDB, dashUser); } },
        { key: "courses", label: "รายวิชา", run: renderTeacherCourses },
        { key: "assignments", label: "งานมอบหมาย", run: renderTeacherAssignments },
        { key: "grading", label: "ตรวจงาน", run: renderTeacherGrading },
        { key: "risk", label: "นักเรียนเสี่ยง", run: renderTeacherRisk }
      ],
      student: [
        { key: "overview", label: "ภาพรวม", run: function () { return renderStudentDashboard(dashDB, dashUser); } },
        { key: "assignments", label: "งานของฉัน", run: renderStudentAssignments }
      ],
      parent: [
        { key: "overview", label: "ภาพรวม", run: function () { return renderParentDashboard(dashDB, dashUser); } },
        { key: "details", label: "รายละเอียด", run: renderParentDetails }
      ]
    };

    function renderTab(viewKey) {
      const views = DASH_VIEWS[dashUser.role];
      const item = views.find(function (view) {
        return view.key === viewKey;
      }) || views[0];
      const tabsHtml = views.map(function (view) {
        return '<button type="button" class="dash-tab' + (view.key === item.key ? " active" : "") +
          '" data-view="' + view.key + '">' + view.label + "</button>";
      }).join("");
      const tabBar = document.getElementById("dash-tabs");
      tabBar.innerHTML = tabsHtml;
      tabBar.querySelectorAll(".dash-tab").forEach(function (button) {
        button.addEventListener("click", function () {
          renderTab(button.dataset.view);
        });
      });
      document.getElementById("dash-content").innerHTML = item.run();
      installViewHandlers(item.key);
    }

    /* ---------- Teacher: รายวิชา ---------- */

    function renderTeacherCourses() {
      const db = dashDB;
      const courses = coursesByTeacher(db, dashUser.id);
      let html = '<div class="toolbar"><h2>รายวิชาของฉัน (' + courses.length + ")</h2>" +
        '<button type="button" class="btn btn-primary btn-sm" id="btn-add-course">+ สร้างรายวิชา</button></div>';
      if (!courses.length) {
        html += emptyNote("ยังไม่มีรายวิชา — กดปุ่ม ‘สร้างรายวิชา’ เพื่อเริ่มต้น");
      } else {
        html += '<div class="dash-panel"><div class="table-wrap"><table class="dash-table"><thead><tr>' +
          "<th>รหัส</th><th>รายวิชา</th><th>หมู่</th><th>นิสิต</th><th>งาน</th><th>จัดการ</th></tr></thead><tbody>";
        courses.forEach(function (course) {
          html += "<tr><td>" + esc(course.code) + "</td><td><strong>" + esc(course.title) + "</strong></td><td>" +
            esc(course.section) + "</td><td>" + course.students.length + "</td><td>" +
            assignmentsForCourse(db, course.id).length + "</td><td><div class='table-actions'>" +
            '<button type="button" class="link-btn" data-enroll="' + esc(course.id) + '">เพิ่มนิสิต</button>' +
            '<button type="button" class="link-btn" data-edit-course="' + esc(course.id) + '">แก้ไข</button>' +
            '<button type="button" class="danger-link" data-del-course="' + esc(course.id) + '">ลบ</button>' +
            "</div></td></tr>";
        });
        html += "</tbody></table></div></div>";
      }
      html += '<div class="dash-panel"><h2>วิธีใช้</h2><p class="muted">สร้างรายวิชา แล้วกด “เพิ่มนิสิต” เพื่อลงทะเบียนนิสิตเข้ารายวิชา — จากนั้นเข้า Tab “งานมอบหมาย” เพื่อสร้างงาน งานที่สร้างจะโผล่ใน Dashboard ของนิสิตทันที</p></div>';
      return html;
    }

    function showCourseModal(courseId) {
      const db = dashDB;
      const course = courseId ? courseById(db, courseId) : null;
      const body =
        '<form id="course-form">' +
        '<div class="form-row">' +
        '<div class="form-field"><label class="form-label" for="f-code">รหัสวิชา</label><input class="form-input" id="f-code" value="' + esc(course ? course.code : "") + '" placeholder="01418112" required /></div>' +
        '<div class="form-field"><label class="form-label" for="f-section">หมู่เรียน</label><input class="form-input" id="f-section" value="' + esc(course ? course.section : "") + '" placeholder="1" required /></div>' +
        "</div>" +
        '<div class="form-field"><label class="form-label" for="f-title">ชื่อรายวิชา</label><input class="form-input" id="f-title" value="' + esc(course ? course.title : "") + '" required /></div>' +
        '<div class="modal-actions"><button type="button" class="btn btn-ghost" data-close>ยกเลิก</button>' +
        '<button type="submit" class="btn btn-primary">' + (course ? "บันทึกการแก้ไข" : "สร้างรายวิชา") + "</button></div>" +
        "</form>";
      openModal(course ? "แก้ไขรายวิชา" : "สร้างรายวิชา", body);
      activeModal.querySelector(".modal-actions [data-close]").addEventListener("click", closeModal);
      activeModal.querySelector("#course-form").addEventListener("submit", function (event) {
        event.preventDefault();
        const payload = {
          code: activeModal.querySelector("#f-code").value.trim(),
          title: activeModal.querySelector("#f-title").value.trim(),
          section: activeModal.querySelector("#f-section").value.trim(),
          teacherId: dashUser.id
        };
        saveCourse(payload, courseId);
        closeModal();
        toastMessage(course ? "บันทึกการแก้ไขรายวิชาแล้ว" : "สร้างรายวิชาแล้ว");
        renderTab("courses");
      });
    }

    function showEnrollModal(courseId) {
      const db = dashDB;
      const course = courseById(db, courseId);
      const students = db.users.filter(function (u) {
        return u.role === "student";
      });
      const rows = students.map(function (student) {
        const enrolled = course.students.indexOf(student.id) !== -1;
        return '<label class="enroll-row"><input type="checkbox" value="' + esc(student.id) + '"' +
          (enrolled ? " checked" : "") + " /> <span>" + esc(student.name) + " (" + esc(student.email) + ")</span></label>";
      }).join("");
      const body =
        '<p class="muted">ติ๊ก/เอาออกเพื่อเพิ่มหรือนำนิสิตออกจากรายวิชา หรือกรอกอีเมลนิสิตใหม่</p>' +
        '<div class="enroll-list">' + (rows || emptyNote("ยังไม่มีข้อมูลนิสิต")) + "</div>" +
        '<form id="enroll-new" class="form-row"><div class="form-field" style="flex:1">' +
        '<input class="form-input" id="enroll-email" placeholder="อีเมลนิสิตใหม่ เช่น name@ku.th" /></div>' +
        '<button type="submit" class="btn btn-secondary btn-sm">เพิ่มนิสิตใหม่</button></form>' +

    function renderTeacherGrading() {
      const db = dashDB;
      const courses = coursesByTeacher(db, dashUser.id);

      const assignments = [];
      courses.forEach(function (course) {
        assignmentsForCourse(db, course.id).forEach(function (assignment) {
          assignments.push({ assignment: assignment, course: course });
        });
      });
      if (!assignments.length) {
        return emptyNote("ยังไม่มีงานมอบหมาย");
      }
      if (assignments.indexOf(dashGradeFilter) === -1 && !assignments.some(function (item) { return item.assignment.id === dashGradeFilter; })) {
        dashGradeFilter = assignments[0].assignment.id;
      }
      const current = assignments.find(function (item) {
        return item.assignment.id === dashGradeFilter;
      }) || assignments[0];
      const options = assignments.map(function (item) {
        return '<option value="' + esc(item.assignment.id) + '"' + (item.assignment.id === current.assignment.id ? " selected" : "") + ">" +
          esc(item.course.code + " — " + item.assignment.title) + "</option>";
      }).join("");

        '<select class="form-select" id="grade-filter" style="max-width:380px">' + options + "</select></div>" +

        html += '<div class="table-wrap"><table class="dash-table"><thead><tr>' +
          "<th>นิสิต</th><th>สถานะ</th><th>ไฟล์</th><th>AI แนะนำ</th><th>คะแนน</th><th>จัดการ</th></tr></thead><tbody>";
        students.forEach(function (studentId) {

          const submission = submissionFor(db, current.assignment.id, studentId);
          const status = submissionStatus(current.assignment, submission);
          const ai = submission && submission.ai;
          html += "<tr><td><strong>" + esc(student.name) + "</strong></td><td>" + statusBadgeHtml(status) + "</td><td>" +
            (submission ? fileChipHtml(submission.fileName, submission.fileType, submission.fileSize, submission.fileData) : '<span class="muted">—</span>') + "</td><td>" +
            (ai ? '<span class="ai-suggest">' + ai.suggestedScore + "/" + current.assignment.points + "</span>" : '<span class="muted">—</span>') + "</td><td>" +
            (submission && submission.score !== null ? "<strong>" + submission.score + " / " + current.assignment.points + "</strong>" : '<span class="muted">—</span>') + "</td><td>" +
            (submission ? '<button type="button" class="link-btn" data-grade="' + esc(current.assignment.id) + "|" + esc(studentId) + '">ให้คะแนน</button>' : '<span class="muted">—</span>') +
            "</td></tr>";

    /* ---------- Teacher: นักเรียนเสี่ยง ---------- */

    function renderTeacherRisk() {
      const db = dashDB;
      const teacherCourses = coursesByTeacher(db, dashUser.id);
      const studentIds = [];
      teacherCourses.forEach(function (course) {
        course.students.forEach(function (id) {
          if (studentIds.indexOf(id) === -1) {
            studentIds.push(id);
          }
        });
      });
      const counts = { low: 0, medium: 0, high: 0 };
      const list = studentIds.map(function (id) {
        const student = findUserById(db, id);
        const risk = computeRisk(db, id);
        counts[risk.level] += 1;
        return { student: student, risk: risk };
      });
      let html = '<div class="dash-stats">' +
        statCard(counts.low, "ความเสี่ยงต่ำ") +
        statCard(counts.medium, "ความเสี่ยงปานกลาง") +
        statCard(counts.high, "ความเสี่ยงสูง") +
        statCard(list.length, "นิสิตในระบบ") +
        "</div>";
      html += '<div class="dash-panel"><div class="panel-head"><h2>รายชื่อนิสิตและสาเหตุความเสี่ยง</h2>' +
        '<a class="btn btn-primary btn-sm" href="risk.html">หน้า Risk Detail</a></div>';
      if (!list.length) {
        html += emptyNote("ยังไม่มีนิสิตในรายวิชาของคุณ");
      } else {
        html += '<div class="table-wrap"><table class="dash-table"><thead><tr>' +
          "<th>ชื่อ</th><th>เข้าเรียน</th><th>งานค้าง</th><th>คะแนนเฉลี่ย</th><th>ระดับ</th></tr></thead><tbody>";
        list.forEach(function (item) {
          html += "<tr><td><strong>" + esc(item.student.name) + "</strong></td><td>" + item.risk.attendancePct + "%</td><td>" +
            item.risk.overdueCount + " งาน</td><td>" + item.risk.avgScore + "</td><td>" + riskBadge(item.risk) + "</td></tr>";
        });
        html += "</tbody></table></div>";
      }
      html += "</div>";
      return html;
    }

      const assignment = findByAssignment(db, assignmentId);

        '<input type="file" id="st-file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" hidden /></div>' +
        '<p class="file-name" id="st-file-name"></p>' +
        '<div class="loading" id="st-loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span>' +
        "<p>AI กำลังอ่านไฟล์และวิเคราะห์เนื้อหา…</p></div>" +
        '<div id="st-ai-result" style="display:none"></div>';
      openModal("ส่งงาน — " + assignment.title, body);
      const zone = activeModal.querySelector("#st-upload-zone");
      const input = activeModal.querySelector("#st-file");
      const fileNameEl = activeModal.querySelector("#st-file-name");
      const loadingEl = activeModal.querySelector("#st-loading");
      const resultEl = activeModal.querySelector("#st-ai-result");

      zone.addEventListener("click", function () {
        input.click();
      });
      input.addEventListener("change", function () {

          return;
        }
        if (!/\.(pdf|doc|docx|png|jpe?g)$/i.test(file.name)) {
          toastMessage("รองรับเฉพาะไฟล์ PDF, DOCX และรูปภาพ");
          return;
        }
        fileNameEl.textContent = "ไฟล์ที่เลือก: " + file.name + " (" + Math.round(file.size / 1024) + " KB)";
        zone.style.display = "none";
        loadingEl.style.display = "block";
        readFileAsDataURL(file, function (dataUrl) {
          setTimeout(function () {
            loadingEl.style.display = "none";
            const ai = aiGradeSubmission(file.name, file.type, file.size);
            resultEl.innerHTML =
              '<div class="ai-suggestion" style="border-left-color:#1aae39"><strong>AI วิเคราะห์ผลงาน: แนะนำ ' + ai.suggestedScore + "/" + assignment.points + "</strong>" +

              '<p class="muted">' + esc(ai.feedback) + "</p></div>" +
              '<div class="modal-actions">' +
              '<button type="button" class="btn btn-ghost" id="st-cancel">ยกเลิก</button>' +
              '<button type="button" class="btn btn-primary" id="st-confirm">ยืนยันส่งงาน</button></div>';
            resultEl.style.display = "block";
            activeModal.querySelector("#st-cancel").addEventListener("click", closeModal);
            activeModal.querySelector("#st-confirm").addEventListener("click", function () {
              submitAssignment(assignmentId, dashUser.id, {
                name: file.name,
                type: file.type || "application/octet-stream",
                size: file.size,
                data: dataUrl
              });
              closeModal();
              toastMessage("ส่งงานเรียบร้อย — AI แนะนำคะแนน " + ai.suggestedScore);
              renderTab("assignments");
            });
          }, 1100);
        });
      });
    }

        if (addBtn) {
          addBtn.addEventListener("click", function () { showCourseModal(null); });
        }
        document.querySelectorAll("[data-edit-course]").forEach(function (button) {
          button.addEventListener("click", function () { showCourseModal(button.dataset.editCourse); });
        });
        document.querySelectorAll("[data-enroll]").forEach(function (button) {
          button.addEventListener("click", function () { showEnrollModal(button.dataset.enroll); });
        });
        document.querySelectorAll("[data-del-course]").forEach(function (button) {
          button.addEventListener("click", function () {
            const course = courseById(dashDB, button.dataset.delCourse);
            if (confirm('ลบรายวิชา "' + course.title + '" พร้อมงานและการส่งทั้งหมด?')) {
              deleteCourse(course.id);
              toastMessage("ลบรายวิชาแล้ว");
              renderTab("courses");
            }
          });
        });
        return;
      }

      if (viewKey === "assignments") {
        if (dashUser.role === "student") {
          document.querySelectorAll("[data-upload]").forEach(function (button) {
            button.addEventListener("click", function () { showUploadModal(button.dataset.upload); });
          });
          return;
        }
        const addBtn = document.getElementById("btn-add-assignment");
        if (addBtn) {
          addBtn.addEventListener("click", function () { showAssignmentModal(null); });
        }
        const filter = document.getElementById("asg-filter");
        if (filter) {
          filter.addEventListener("change", function () {
            dashCourseFilter = filter.value;
            renderTab("assignments");
          });
        }
        document.querySelectorAll("[data-edit-assignment]").forEach(function (button) {
          button.addEventListener("click", function () { showAssignmentModal(button.dataset.editAssignment); });
        });
        document.querySelectorAll("[data-del-assignment]").forEach(function (button) {
          button.addEventListener("click", function () {
            const assignment = findByAssignment(dashDB, button.dataset.delAssignment);
            if (confirm('ลบงาน "' + assignment.title + '" และการส่งทั้งหมด?')) {
              deleteAssignment(assignment.id);
              toastMessage("ลบงานแล้ว");
              renderTab("assignments");
            }
          });
        });
        return;
      }

      if (viewKey === "grading") {
        const filter = document.getElementById("grade-filter");
        if (filter) {
          filter.addEventListener("change", function () {
            dashGradeFilter = filter.value;
            renderTab("grading");
          });
        }
        document.querySelectorAll("[data-grade]").forEach(function (button) {
          button.addEventListener("click", function () {
            const parts = button.dataset.grade.split("|");
            showGradeModal(parts[0], parts[1]);
          });
        });
      }
    }

    function renderDashboard() {
      const user = getCurrentUser();
      if (!user) {
        return;
      }
      const db = findAll();
      let record = findByEmail(db, user.email);
      if (!record) {
        record = createUser(user.email, user.role);
      }
      const info = ROLES[record.role] || ROLES.student;
      document.getElementById("dash-role").textContent = info.label;
      document.getElementById("dash-greeting").textContent = "ยินดีต้อนรับ " + info.label;
      document.getElementById("dash-email").textContent = record.name + " · " + record.email;

      dashDB = db;
      dashUser = record;
      renderTab("overview");
    }

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeModal();
      }
    });

    renderDashboard();
  </script>
</body>
</html>
